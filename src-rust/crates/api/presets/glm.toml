schema_version = 1

[provider]
name = "glm"
aliases = ["zhipu", "bigmodel", "z.ai"]
display_name = "Zhipu (GLM)"
description = "GLM via z.ai — OpenAI-compatible, vision-capable"
attribution = "powered by Zhipu AI (GLM)"
provider_type = "openai_compat"
api_format = "openai"
# z.ai is the international rebrand of Zhipu's BigModel API. The endpoint
# already includes the /v4 version segment; openai_provider's URL builder
# detects this via `base_already_versioned` and skips the redundant /v1/.
api_base = "https://api.z.ai/api/paas/v4"
# z.ai accepts image inputs on its vision-capable models (glm-4.6v,
# glm-5, glm-4.5v, ...). The provider-level flag stays true; whether a
# given model actually supports vision is the operator's concern (key /
# region / plan), and is enforced by the API itself.
supports_vision = true
# z.ai expects the Anthropic-spec `thinking: {type: "enabled",
# budget_tokens: N}` block on its OpenAI-compat wire (per z.ai GLM-5+ docs).
thinking_format = "anthropic_nested"

[auth]
env_vars = ["ZHIPU_API_KEY", "GLM_API_KEY"]
keychain_key = "glm"
display_label = "Zhipu (GLM)"
required = true

[defaults]
max_tokens = 16384
request_timeout_sec = 600
max_retries = 5

# ── Models ─────────────────────────────────────────────────────────────────
# Canonical model catalogue. INFORMATIONAL — the CLI does not gatekeep
# `--model X` against this list. The operator's key/region/plan/tier
# determines what is actually callable; the API itself returns 400 on
# unknown IDs. Pricing is best-effort per the z.ai public price sheet —
# verify before refacturation.
#
# NO `fast_model` entry: hybrid mode (default ↔ fast) would route
# tool-result turns containing images to the fast model. If that fast
# model lacks vision, the second API call would fail. On GLM we stay
# on a single vision-capable model end-to-end.

[[models]]
id = "glm-4.6v"
display_name = "GLM 4.6V"
description = "Flagship vision-capable GLM — default for this provider"
context_window = 128000
max_output_tokens = 16384
supports_thinking = false
default = true

[models.pricing]
input_per_mtk = 0.30
output_per_mtk = 0.90

[[models]]
id = "glm-5"
display_name = "GLM 5"
description = "Newer GLM generation — vision-capable on z.ai"
context_window = 128000
max_output_tokens = 16384
supports_thinking = false

[models.pricing]
input_per_mtk = 0.50
output_per_mtk = 1.50

[[models]]
id = "glm-4.6"
display_name = "GLM 4.6"
description = "Text-only flagship reasoning model"
context_window = 128000
max_output_tokens = 16384
supports_thinking = true

[models.pricing]
input_per_mtk = 0.40
output_per_mtk = 1.20

[[models]]
id = "glm-4.5v"
display_name = "GLM 4.5V"
description = "Previous generation vision model, kept for back-compat"
context_window = 128000
max_output_tokens = 16384
supports_thinking = false

[models.pricing]
input_per_mtk = 0.30
output_per_mtk = 0.90

[[models]]
id = "glm-4.5"
display_name = "GLM 4.5"
description = "Previous generation text-only model"
context_window = 128000
max_output_tokens = 16384
supports_thinking = false

[models.pricing]
input_per_mtk = 0.20
output_per_mtk = 0.50
